<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>登录 - 证书管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">证书管理系统</h3>

                    <!-- 登录失败提示 -->
                    <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
                    <!-- 已退出提示 -->
                    <div th:if="${logoutMsg}" class="alert alert-success" th:text="${logoutMsg}"></div>

                    <!-- 登录表单：使用 th:action 以便 Thymeleaf 自动注入 CSRF 令牌 -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>

                    <p class="text-muted small mt-3 mb-0 text-center">默认账号 admin / admin123，请登录后尽快修改。</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
