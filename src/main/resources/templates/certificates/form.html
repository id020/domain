<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{common :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{common :: nav}"></div>
<div class="container">
    <h1 class="mb-4">上传证书</h1>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/certificates/upload}" method="post">
        <div class="mb-3">
            <label class="form-label">证书别名 *</label>
            <input type="text" class="form-control" name="name" placeholder="例如：生产环境主证书" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">关联域名</label>
            <input type="text" class="form-control" name="domainName" placeholder="可选，如 www.example.com"/>
        </div>
        <div class="mb-3">
            <label class="form-label">证书内容（PEM，含 -----BEGIN CERTIFICATE-----）*</label>
            <textarea class="form-control" name="certPem" rows="10" required
                      placeholder="粘贴证书 PEM 文本"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">私钥（PEM，可选）</label>
            <textarea class="form-control" name="privateKeyPem" rows="6"
                      placeholder="粘贴私钥 PEM 文本，留空则仅保存证书"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">上传并入库</button>
        <a class="btn btn-success" th:href="@{/certificates/issue}">改用 ACME 签发</a>
        <a class="btn btn-secondary" th:href="@{/certificates}">返回</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
