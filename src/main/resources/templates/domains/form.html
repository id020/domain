<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{common :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{common :: nav}"></div>
<div class="container">
    <h1 class="mb-4" th:text="${isNew} ? '新增域名' : '编辑域名'"></h1>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- 新增与编辑共用同一表单，按 isNew 决定提交地址 -->
    <form th:action="@{${isNew} ? '/domains' : '/domains/' + ${domain.id}}"
          method="post" th:object="${domain}">
        <div class="mb-3">
            <label class="form-label">域名 *</label>
            <input type="text" class="form-control" th:field="*{name}"
                   placeholder="www.example.com" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">探测端口</label>
            <input type="number" class="form-control" th:field="*{port}" min="1" max="65535"/>
            <div class="form-text">默认 443，用于 HTTPS 证书检测</div>
        </div>
        <div class="mb-3">
            <label class="form-label">备注</label>
            <textarea class="form-control" th:field="*{description}" rows="3"
                      placeholder="可选：用途、负责人等"></textarea>
        </div>

        <!-- 域名注册信息（Whois）：当系统无法自动查询（如网络不通）时，可在此手动补录 -->
        <div class="mb-3">
            <label class="form-label">域名注册信息（Whois，可选）</label>
            <div class="border rounded p-3">
                <div class="mb-2">
                    <label class="form-label">注册商</label>
                    <input type="text" class="form-control" th:field="*{whoisRegistrar}" placeholder="如 GoDaddy.com, LLC"/>
                </div>
                <div class="mb-2">
                    <label class="form-label">注册时间</label>
                    <input type="text" class="form-control" th:field="*{whoisCreationDate}" placeholder="如 2020-01-01T00:00:00Z"/>
                </div>
                <div class="mb-2">
                    <label class="form-label">域名过期时间</label>
                    <input type="text" class="form-control" th:field="*{whoisExpiryDate}" placeholder="如 2030-01-01T00:00:00Z"/>
                </div>
            </div>
            <div class="form-text">系统新增/刷新失败时可手动填写；保存后将在列表与详情页展示。</div>
        </div>

        <button type="submit" class="btn btn-primary">保存</button>
        <a th:href="@{/domains}" class="btn btn-secondary">返回</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
