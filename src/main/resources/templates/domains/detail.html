<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{common :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{common :: nav}"></div>
<div class="container">

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0" th:text="${domain.name}">域名</h1>
        <div>
            <form th:action="@{/domains/{id}/check(id=${domain.id})}" method="post" style="display:inline">
                <button class="btn btn-success btn-sm">立即检测</button>
            </form>
            <a class="btn btn-primary btn-sm" th:href="@{/domains/{id}/edit(id=${domain.id})}">编辑</a>
            <a class="btn btn-secondary btn-sm" th:href="@{/domains}">返回列表</a>
        </div>
    </div>

    <!-- 域名基本信息（始终展示，是域名的主信息） -->
    <div class="card mb-4">
        <div class="card-header">域名基本信息</div>
        <div class="card-body">
            <p>域名：<span th:text="${domain.name}"></span></p>
            <p>探测端口：<span th:text="${domain.port}"></span></p>
            <p>备注：<span th:text="${domain.description} ?: '—'"></span></p>
            <p>创建时间：<span th:text="${#temporals.format(domain.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
            <p>更新时间：<span th:text="${#temporals.format(domain.updatedAt, 'yyyy-MM-dd HH:mm')}"></span></p>
        </div>
    </div>

    <!-- 域名注册信息（Whois）：域名过期时间、注册商等（读库内缓存值，环境不通时也可手动补录） -->
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>域名注册信息（Whois）</span>
            <!-- 优先 HTTPS RDAP，失败时回退 TCP 43 WHOIS -->
            <form th:action="@{/domains/{id}/refresh-whois(id=${domain.id})}" method="post" style="margin:0">
                <button class="btn btn-outline-secondary btn-sm">刷新 Whois</button>
            </form>
        </div>
        <div class="card-body">
            <!-- 库内无缓存且实时查询失败时的提示 -->
            <div th:if="${whois.error}" class="text-warning small"
                 th:text="'自动查询失败：' + ${whois.error} + '（可编辑域名手动填写）'"></div>
            <p th:if="${whois.registrableDomain != null and !#strings.equalsIgnoreCase(whois.registrableDomain, domain.name)}"
               class="text-muted">注册信息所属域名：<strong th:text="${whois.registrableDomain}"></strong>（当前子域名的 SSL/DNS 单独检测）</p>
            <p th:if="${whois.source}">实时查询来源：<span class="badge bg-info" th:text="${whois.source}"></span></p>
            <p>域名过期时间：<span th:text="${domain.whoisExpiryDate} ?: '—'"></span></p>
            <p>注册商：<span th:text="${domain.whoisRegistrar} ?: '—'"></span></p>
            <p>注册时间：<span th:text="${domain.whoisCreationDate} ?: '—'"></span></p>
            <p th:if="${whois.statuses != null}">状态：<span th:each="s : ${whois.statuses}" th:text="${s} + ' '"></span></p>
            <p th:if="${whois.nameServers != null}">名称服务器：<span th:each="ns : ${whois.nameServers}" th:text="${ns} + ' '"></span></p>
            <p th:if="${domain.whoisExpiryDate == null and domain.whoisRegistrar == null and domain.whoisCreationDate == null}"
               class="text-muted">暂无注册信息，可点击“刷新 Whois”或“编辑”手动填写。</p>
        </div>
    </div>

    <!-- SSL 证书状态（域名可选附带的 HTTPS 证书信息） -->
    <div class="card mb-4">
        <div class="card-header">SSL 证书状态</div>
        <div class="card-body">
            <p>
                <span th:switch="${domain.certStatus != null ? domain.certStatus.name() : ''}">
                    <span th:case="'OK'" class="badge bg-success">正常</span>
                    <span th:case="'EXPIRING'" class="badge bg-warning text-dark">即将过期</span>
                    <span th:case="'EXPIRED'" class="badge bg-danger">已过期</span>
                    <span th:case="'NONE'" class="badge bg-secondary">无证书</span>
                    <span th:case="'ERROR'" class="badge bg-danger">检测失败</span>
                    <span th:case="''" class="badge bg-light text-dark">未检测</span>
                </span>
            </p>
            <p>主域名(CN)：<span th:text="${domain.certCommonName} ?: '—'"></span></p>
            <p>签发者：<span th:text="${domain.certIssuer} ?: '—'"></span></p>
            <p>剩余天数：<span th:text="${domain.certDaysLeft} != null ? ${domain.certDaysLeft} + ' 天' : '—'">—</span></p>
            <p>到期时间：<span th:text="${domain.certExpiryAt != null ? #temporals.format(domain.certExpiryAt, 'yyyy-MM-dd HH:mm') : '—'}">—</span></p>
            <p class="text-danger" th:if="${domain.lastError}" th:text="'检测错误：' + ${domain.lastError}"></p>
            <p class="text-muted" th:text="'最后检测：' + (${domain.lastCheckAt != null ? #temporals.format(domain.lastCheckAt, 'yyyy-MM-dd HH:mm') : '从未'})"></p>
        </div>
    </div>

    <!-- 删除 -->
    <form th:action="@{/domains/{id}/delete(id=${domain.id})}" method="post"
          onsubmit="return confirm('确认删除该域名？');">
        <button class="btn btn-danger">删除域名</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
