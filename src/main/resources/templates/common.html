<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">证书管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<!-- 顶部导航栏片段 -->
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">证书管理系统</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">仪表盘</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/domains}">域名管理</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/certificates}">证书管理</a></li>
            <!-- 仅当用户具备“用户管理”权限（或管理员）时显示入口 -->
            <li class="nav-item" th:if="${canManageUsers}">
                <a class="nav-link" th:href="@{/users}">用户管理</a>
            </li>
        </ul>
        <!-- 登录用户区：显示当前用户名与退出按钮（GlobalModelAdvice 注入 currentUser/isLoggedIn） -->
        <div class="d-flex align-items-center" th:if="${isLoggedIn}">
            <span class="navbar-text text-light me-3" th:text="'你好，' + ${currentUser}">你好</span>
            <!-- 退出表单使用 th:action，Thymeleaf 自动注入 CSRF 令牌 -->
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button type="submit" class="btn btn-outline-light btn-sm">退出</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
